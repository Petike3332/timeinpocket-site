<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time in Pocket</title>
<meta name="description" content="Time in Pocket: jobs, invoices and time log for tradespeople. Coming soon to iPhone.">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  /* No web fonts, no scripts, no cookies: nothing loads from anywhere else. */
  :root { --bg: #0B0D10; --card: #171A1F; --text: #EDEEF0; --sub: #A3A8B0; --amber: #F2B13F; --line: rgba(255,255,255,0.09); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px 32px; }
  main { width: 100%; max-width: 440px; text-align: center; }
  .icon { width: 120px; height: 120px; border-radius: 27px; display: block; margin: 0 auto 28px;
          box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 14px 40px rgba(0,0,0,0.6), 0 0 60px rgba(242,177,63,0.12); }
  h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.5px; margin: 0 0 10px; font-weight: 800; }
  .tag { color: var(--amber); font-size: 19px; font-weight: 600; margin: 0 0 22px; }
  .what { color: var(--sub); font-size: 16px; margin: 0 0 30px; }
  .soon { display: inline-block; border: 1px solid rgba(242,177,63,0.5); color: var(--amber); border-radius: 999px;
          padding: 8px 18px; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 34px; }
  .mail { display: block; color: var(--text); text-decoration: none; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 15px 16px; font-size: 16px; }
  .mail span { color: var(--sub); display: block; font-size: 13px; margin-bottom: 2px; }
  .mail:hover, .mail:focus-visible { border-color: rgba(242,177,63,0.6); outline: none; }
  footer { margin-top: 48px; color: var(--sub); font-size: 13px; text-align: center; }
  footer a { color: var(--sub); }
  footer a:hover { color: var(--amber); }
</style>
</head>
<body>
<main>
  <img class="icon" src="/icon.png" alt="Time in Pocket app icon" width="120" height="120">
  <h1>Time in Pocket</h1>
  <p class="tag">Know your hours. Keep your money.</p>
  <p class="what">Jobs, timer, quotes and invoices, money, mileage and expenses, in one app for tradespeople.</p>
  <div class="soon">Coming soon to iPhone</div>
  <a class="mail" href="mailto:hello@timeinpocket.co.uk"><span>Questions</span>hello@timeinpocket.co.uk</a>
</main>
<footer>
  <a href="/privacy/">Privacy &amp; terms</a> · No cookies, no tracking<br>
  © 2026 Time in Pocket
</footer>
</body>
</html>
